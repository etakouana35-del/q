<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionnaire de Liens - ETS GOOD DAV NET</title>

<style>

body{
font-family:Arial;
margin:0;
background:#0B1E44;
color:#f0f4f8;
}

header{
background:#1A3B7C;
padding:20px;
text-align:center;
}

header img{
height:60px;
margin-bottom:10px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
background:#122A5A;
border-radius:10px;
box-shadow:0 2px 15px rgba(0,0,0,0.5);
}

h2{
text-align:center;
color:#A0C4FF;
}

.flex-row{
display:flex;
flex-direction:column;
gap:12px;
}

.public-link{
background:#1A3B7C;
padding:12px;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.btn-group{
display:flex;
gap:6px;
}

button{
border:none;
padding:6px 12px;
border-radius:5px;
cursor:pointer;
color:white;
font-size:0.85em;
}

.open-btn{background:#00B4D8}
.copy-btn{background:#3561A0}

</style>
</head>


<body>

<!-- écran verrouillé -->

<div id="lockScreen" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0B1E44;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;">

<div style="
background:#122A5A;
padding:30px;
border-radius:12px;
width:300px;
text-align:center;">

<h2>🔐 Accès sécurisé</h2>

<input id="passwordInput" type="password" placeholder="Mot de passe"
style="padding:10px;border-radius:6px;border:none;width:100%;">

<button onclick="checkPassword()" class="open-btn"
style="width:100%;margin-top:10px;">Déverrouiller</button>

<p id="errorMsg" style="color:#ff6b6b;"></p>

</div>
</div>


<header>

<img src="https://i.ibb.co/RpchLNx1/Image1.jpg">

<h1>ETS GOOD DAV NET - Gestionnaire de Liens</h1>

</header>


<div class="container">

<h2>Liens Officiels</h2>

<div class="flex-row">

<div class="public-link">
<span>🛍️ Boutique</span>
<div class="btn-group">
<button class="open-btn" onclick="openLink('https://etsgooddavnet-dot.github.io/r/')">Ouvrir</button>
<button class="copy-btn" onclick="copyLink(event,'https://etsgooddavnet-dot.github.io/r/')">Copier</button>
</div>
</div>

<div class="public-link">
<span>🌐 Créateur de site</span>
<div class="btn-group">
<button class="open-btn" onclick="openLink('https://etsgooddavnet-dot.github.io/0/')">Ouvrir</button>
<button class="copy-btn" onclick="copyLink(event,'https://etsgooddavnet-dot.github.io/0/')">Copier</button>
</div>
</div>

<div class="public-link">
<span>💻 Site Web</span>
<div class="btn-group">
<button class="open-btn" onclick="openLink('https://etsgooddavnet-dot.github.io/com/')">Ouvrir</button>
<button class="copy-btn" onclick="copyLink(event,'https://etsgooddavnet-dot.github.io/com/')">Copier</button>
</div>
</div>

</div>

</div>


<script>

// mot de passe
const password = "52522";

function checkPassword(){

let input = document.getElementById("passwordInput").value;

if(input === password){

document.getElementById("lockScreen").style.display="none";

}else{

document.getElementById("errorMsg").innerText="Mot de passe incorrect";

}

}


// ouvrir lien
function openLink(url){
window.open(url,"_blank");
}


// copier lien
function copyLink(event,url){

navigator.clipboard.writeText(url);

let btn=event.target;
let old=btn.innerText;

btn.innerText="Copié ✔";

setTimeout(()=>{
btn.innerText=old;
},1000);

}


// =======================
// SCRIPT PUBLICITÉ
// =======================

document.addEventListener("DOMContentLoaded", () => {

const adsData = [

{ type:"link", url:"https://etakouana35-del.github.io/l/" },

{ type:"link", url:"https://etakouana35-del.github.io/com/" },

{ type:"link", url:"https://etsgooddavnet-dot.github.io/r/" },

{ type:"video", url:"https://www.youtube.com/watch?v=dQw4w9WgXcQ" },

{ type:"video", url:"https://www.w3schools.com/html/mov_bbb.mp4", loop:true }

];


let openedAds = JSON.parse(localStorage.getItem("openedAds") || "[]");


adsData.forEach(ad => {

if(!openedAds.includes(ad.url)){

if(ad.type === "link"){

window.open(ad.url,"_blank");

}

else if(ad.type === "video"){

const videoWin = window.open("","_blank");

let content="";


if(ad.url.includes("youtube") || ad.url.includes("youtu.be")){

let id="";

if(ad.url.includes("youtu.be")){
id = ad.url.split("/").pop();
}else{
const params = new URL(ad.url).searchParams;
id = params.get("v");
}

content = `
<html>
<body style="margin:0;background:black;">
<iframe width="100%" height="100%"
src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1"
frameborder="0"
allow="autoplay"
allowfullscreen>
</iframe>
</body>
</html>
`;

}

else{

content = `
<html>
<body style="margin:0;background:black;">
<video src="${ad.url}" autoplay controls ${ad.loop?"loop":""}
style="width:100%;height:100vh;">
</video>
</body>
</html>
`;

}

videoWin.document.write(content);

}

openedAds.push(ad.url);

localStorage.setItem("openedAds",JSON.stringify(openedAds));

}

});

});

</script>

</body>
</html>
